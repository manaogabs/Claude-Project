<!doctype html>

</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <a class="pular" href="#cardapio">Pular para o cardápio</a>

  <header class="topo" id="topo">
    <div class="topo__barra">
      <a class="topo__logo" href="#inicio" aria-label="Duna Terrazzo, início">
        <svg viewBox="0 0 812.491 192.55" aria-hidden="true"><use href="#duna"/></svg>
      </a>
      <span class="topo__rotulo">Cardápio</span>
    </div>
    <nav class="menu" aria-label="Setores do cardápio">
      <ul class="menu__lista" id="menu"></ul>
    </nav>
  </header>

  <main>
    <section class="capa" id="inicio">
      <div class="capa__motivo capa__motivo--esq" aria-hidden="true"></div>
      <div class="capa__motivo capa__motivo--dir" aria-hidden="true"></div>
      <div class="capa__conteudo">
        <h1 class="capa__logo">
          <svg viewBox="0 0 812.491 192.55" role="img" aria-label="Duna"><use href="#duna"/></svg>
          <span class="capa__terrazzo">Terrazzo</span>
        </h1>
        <p class="rotulo capa__titulo">Cardápio</p>
        <p class="capa__chamada" id="chamada"></p>
        <ul class="capa__setores" id="atalhos" aria-label="Ir para um setor"></ul>
      </div>
      <figure class="capa__foto" id="capa-foto" hidden></figure>
    </section>

    <div class="cardapio" id="cardapio"></div>
  </main>

  <footer class="rodape" id="rodape">
    <svg class="rodape__logo" viewBox="0 0 812.491 192.55" aria-hidden="true"><use href="#duna"/></svg>
    <p class="rodape__terrazzo">Terrazzo</p>
    <div class="rodape__info" id="info"></div>
    <ul class="rodape__obs" id="obs"></ul>
  </footer>

  <a class="voltar" href="#inicio" aria-label="Voltar ao topo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>

  <script src="dados.js"></script>
